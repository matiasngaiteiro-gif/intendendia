<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Intendencia · La aplicación se mudó</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f2ed; color: #15171c; }
    main { max-width: 34rem; margin: 0 auto; padding: 48px 20px; }
    .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: #17233d; color: #fff; font-weight: bold; }
    h1 { font-size: 1.7rem; margin: 20px 0 10px; }
    p { font-size: 1.1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">IC</span>
    <h1>La aplicación de Intendencia se mudó</h1>
    <p>Ahora se abre desde la dirección de Google de la planilla, que empieza con <strong>script.google.com</strong>. Los pedidos, el inventario y las herramientas son los mismos.</p>
    <p>Si no tenés esa dirección guardada como favorito, pedísela a quien administra la planilla.</p>
  </main>
  <script>
    // Quita la copia de la versión anterior que quedó guardada en este navegador.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('intendencia-')).forEach(k => caches.delete(k))).catch(() => {});
  </script>
</body>
</html>
