<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17233d">
  <meta name="referrer" content="no-referrer">
  <title>Intendencia · Pedidos de trabajo</title>
  <style>
/* Intendencia — prueba piloto. Pensada para leerse fácil: letra grande, botones grandes, mucho contraste. */
:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --ink: #15171c;
  --muted: #4a4f5a;
  --line: #d9d5cc;
  --navy: #17233d;
  --primary: #1d4ed8;
  --primary-ink: #ffffff;
  --primary-soft: #e6edfd;
  --green: #137a3d;
  --green-dark: #0f6331;
  --red: #b42318;
  --red-soft: #fde8e6;
  --amber: #9a5b00;
  --amber-soft: #fdf1dc;
  --blue-soft: #e6edfd;
  --done-soft: #e3f3e8;
  --radius: 16px;
  --tap: 60px;
  --shadow: 0 1px 2px rgba(20, 22, 28, .06), 0 2px 8px rgba(20, 22, 28, .05);
  font-size: 19px;
}
html[data-text-size="grande"] { font-size: 21.5px; }
html[data-text-size="muy-grande"] { font-size: 24px; }

* { box-sizing: border-box; }
.ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.crumb { display: flex; align-items: center; gap: 8px; }
.back .ico { width: 20px; height: 20px; }
.search .ico { color: var(--muted); }
.lend { display: grid; gap: 10px; margin-top: 8px; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 1rem; line-height: 1.45;
}
a { color: var(--primary); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 12px; top: 12px; z-index: 50; background: #fff; padding: 10px 14px; border-radius: 8px; }

/* ---------- Encabezado y navegación ---------- */
.top { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 20; }
.top-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; margin-right: auto; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; background: #fff; color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.brand strong { display: block; font-size: 1.05rem; }
.brand small { display: block; font-size: .72rem; opacity: .8; }
.tabs { display: flex; gap: 4px; }
.tabs a {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 88px;
  padding: 8px 10px; border-radius: 12px; color: #dfe5f2; text-decoration: none; font-size: .78rem; font-weight: 600;
}
.tabs a span { display: grid; place-items: center; }
.tabs .ico { width: 24px; height: 24px; }
.tabs a:hover { background: rgba(255, 255, 255, .1); }
.tabs a.active { background: #fff; color: var(--navy); }

main { max-width: 760px; margin: 0 auto; padding: 22px 16px 120px; outline: none; }

@media (max-width: 720px) {
  .top-inner { padding: 8px 16px; }
  .brand small { display: none; }
  .brand-mark { width: 36px; height: 36px; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; box-shadow: 0 -2px 10px rgba(0,0,0,.06);
  }
  .tabs a { color: var(--muted); flex: 1; min-width: 0; padding: 6px 2px; }
  .tabs a.active { background: var(--primary-soft); color: var(--primary); }
  body[data-screen="nuevo"] .tabs, body[data-screen="editar"] .tabs { display: none; }
}
@media all {
  body[data-screen="conectar"] .tabs { display: none; }
  .connect { max-width: 560px; margin: 4vh auto 0; }
  .connect .sheet-form { margin-top: 18px; }
}

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: var(--tap); padding: 12px 22px; border-radius: 14px; border: 2px solid transparent;
  font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer; text-align: center;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: #1a43bd; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: #b8b2a6; }
.btn-ghost { background: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-danger { background: var(--red); color: #fff; }
.btn-link-danger { background: none; border: none; color: var(--red); text-decoration: underline; min-height: 52px; font-weight: 600; cursor: pointer; padding: 8px 12px; }
.btn-small { min-height: 48px; padding: 8px 16px; font-size: .9rem; border-radius: 12px; }
.btn-hero { width: 100%; min-height: 76px; font-size: 1.25rem; border-radius: 16px; }
.btn-hero .ico { width: 28px; height: 28px; stroke-width: 2.2; }
.btn-back { margin-top: 18px; }

/* ---------- Lista de pedidos ---------- */
.page-title { font-size: 1.6rem; margin-bottom: 6px; }
.lead { color: var(--muted); margin: 0 0 16px; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #e7e3da; padding: 6px; border-radius: 16px; margin: 22px 0 12px; }
.segmented-3 { grid-template-columns: repeat(3, 1fr); margin: 12px 0 0; }
.segmented a, .segmented button {
  min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-weight: 700; text-decoration: none; cursor: pointer;
}
.segmented a b { background: #d6d1c6; color: var(--ink); border-radius: 999px; padding: 1px 10px; font-size: .85rem; }
.segmented .active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.segmented a.active b { background: var(--primary); color: #fff; }
.summary-line { margin: 4px 0 12px; color: var(--muted); }

.filters { display: grid; gap: 10px; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 0 14px; min-height: var(--tap); margin: 14px 0; }
.filters .search { margin: 0; }
.search:focus-within { border-color: var(--primary); }
.search input { border: 0; outline: none; flex: 1; min-width: 0; background: transparent; padding: 12px 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }

.list { display: grid; gap: 12px; margin: 14px 0 18px; }
.card {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--surface); border: 2px solid transparent; border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); color: var(--ink); text-decoration: none; cursor: pointer;
}
a.card:hover, button.card:hover { border-color: #c9c3b6; }
.card.is-urgent { border-left: 8px solid var(--red); }
.card-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--bg); color: var(--navy); display: grid; place-items: center; flex: none; }
.card-icon .ico { width: 28px; height: 28px; }
.card-icon.big { width: 64px; height: 64px; }
.card-icon.big .ico { width: 34px; height: 34px; }
.card-main { display: grid; gap: 3px; flex: 1; min-width: 0; }
.card-title { font-weight: 700; font-size: 1.08rem; }
.card-sub { color: var(--ink); }
.card-meta { color: var(--muted); font-size: .9rem; }
.card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; background: #ecebe7; color: var(--ink); white-space: nowrap; }
.pill-urgent { background: var(--red); color: #fff; }
.pill-pending { background: #ecebe7; }
.pill-progress { background: var(--blue-soft); color: #1e3a8a; }
.pill-missing { background: var(--amber-soft); color: var(--amber); }
.pill-done { background: var(--done-soft); color: var(--green-dark); }
@media (max-width: 520px) {
  .order-card { flex-wrap: wrap; }
  .order-card .card-side { flex-direction: row; width: 100%; padding-left: 66px; justify-content: flex-start; }
  .order-card .card-side:empty { display: none; }
  .card-icon { width: 46px; height: 46px; font-size: 1.5rem; }
}

.empty { text-align: center; padding: 34px 20px; background: var(--surface); border-radius: var(--radius); border: 2px dashed var(--line); }
.empty p { margin: 8px 0; }

.notice { display: flex; gap: 12px; align-items: center; background: var(--amber-soft); border: 2px solid #f1d39c; border-radius: var(--radius); padding: 14px 16px; margin-top: 16px; }
.notice-ico { width: 30px; height: 30px; color: var(--amber); }
.notice p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.notice div { flex: 1; }
@media (max-width: 520px) { .notice { flex-wrap: wrap; } .notice .btn { width: 100%; } }

/* ---------- Detalle de un pedido ---------- */
.back { display: inline-flex; align-items: center; min-height: 52px; padding: 8px 4px; font-weight: 700; color: var(--primary); text-decoration: none; background: none; border: 0; cursor: pointer; font-size: 1rem; }
.detail { background: var(--surface); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); min-width: 0; }
@media (max-width: 520px) { .detail { padding: 18px 16px; } .detail-head .card-icon.big { width: 56px; height: 56px; font-size: 1.9rem; } .detail h1 { font-size: 1.35rem; } }
.detail-head { display: flex; gap: 16px; align-items: flex-start; }
.detail h1 { font-size: 1.55rem; margin: 2px 0 8px; }
.eyebrow { margin: 0; color: var(--muted); font-size: .85rem; font-weight: 600; }
.facts { margin: 20px 0 6px; display: grid; gap: 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-weight: 600; }
.facts dd { margin: 0; font-weight: 600; }
@media (max-width: 520px) { .facts div { grid-template-columns: 1fr; gap: 2px; } }
.section-title { font-size: 1.1rem; margin: 22px 0 10px; }
.status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.status-btn {
  min-height: 66px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 8px 10px; line-height: 1.2; text-align: left;
}
.status-btn .ico { width: 22px; height: 22px; }
.status-btn.active { border-width: 3px; }
.status-pending.active { background: #ecebe7; border-color: #6b6f78; }
.status-progress.active { background: var(--blue-soft); border-color: var(--primary); color: #1e3a8a; }
.status-missing.active { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.status-done.active { background: var(--done-soft); border-color: var(--green); color: var(--green-dark); }
.action-stack { display: grid; gap: 12px; margin-top: 22px; }
.action-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hint { margin: -4px 0 0; color: var(--muted); font-size: .92rem; }

/* ---------- Paso a paso ---------- */
.wizard-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.wizard-head .back { color: var(--muted); }
.step-count { margin: 0 0 0 auto; font-weight: 700; color: var(--muted); }
.progress { flex-basis: 100%; height: 8px; background: #e2ded5; border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .25s ease; }
.q { font-size: 1.65rem; margin: 6px 0 18px; }
.sub-q { font-size: 1.15rem; margin: 22px 0 10px; }
.crumb { margin: 0; color: var(--muted); font-weight: 700; }
.group-label { margin: 16px 0 8px; color: var(--muted); font-weight: 700; font-size: .9rem; text-transform: uppercase; letter-spacing: .03em; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tiles-3 { grid-template-columns: repeat(3, 1fr); }
.tiles-2 { grid-template-columns: 1fr 1fr; }
.tiles-compact { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  min-height: 112px; padding: 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow); cursor: pointer;
}
.tile:hover { border-color: #aaa395; }
.tile.selected { border: 3px solid var(--primary); background: var(--primary-soft); }
.tile-urgent.selected { border-color: var(--red); background: var(--red-soft); }
.tile .tile-icon { width: 34px; height: 34px; color: var(--navy); margin-bottom: 6px; }
.tile-urgent .tile-icon { color: var(--red); }
.tile.selected .tile-icon { color: var(--primary); }
.tile-urgent.selected .tile-icon { color: var(--red); }
.tile-label { font-weight: 800; font-size: 1.1rem; }
.tile-hint { color: var(--muted); font-size: .88rem; }
.tile-building { min-height: 92px; justify-content: center; }
.tiles-compact .tile { min-height: 84px; padding: 12px; }
.tiles-compact .tile-label { font-size: .95rem; }
@media (max-width: 560px) {
  .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tiles-3 { grid-template-columns: 1fr; }
  .tile { min-height: 104px; padding: 14px; }
  .tile-building { min-height: 70px; flex-direction: row; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .q { font-size: 1.45rem; }
}

.options { display: grid; gap: 10px; }
.options-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.option {
  min-height: var(--tap); padding: 12px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 700; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.option small { font-weight: 500; color: var(--muted); font-size: .85rem; }
.option:hover { border-color: #aaa395; }
.option.selected { border: 3px solid var(--primary); background: var(--primary-soft); }
.option-other { border-style: dashed; color: var(--primary); }
@media (max-width: 400px) { .options-grid { grid-template-columns: 1fr 1fr; } }

.field { margin-top: 22px; display: grid; gap: 10px; }
.custom-task { margin-top: 16px; display: grid; gap: 10px; }
.field-label { font-weight: 700; display: block; margin-top: 12px; }
.optional { font-weight: 500; color: var(--muted); }
input:not([type=search]):not([type=file]), select, textarea {
  width: 100%; min-height: var(--tap); padding: 12px 14px; border: 2px solid #bdb7aa; border-radius: 12px; background: #fff;
}
textarea { min-height: 100px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: 3px solid rgba(29, 78, 216, .2); outline-offset: 0; }

.review { margin: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 4px 18px; }
.review-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.review-row:last-child { border-bottom: 0; }
.review-row > div { flex: 1; }
.review dt { color: var(--muted); font-size: .9rem; font-weight: 600; }
.review dd { margin: 2px 0 0; font-weight: 700; font-size: 1.05rem; }

/* ---------- Herramientas, contactos y ajustes ---------- */
.tool-card .card-side { max-width: 45%; }
.tool-card .pill { white-space: normal; text-align: right; }
.contact-card { flex-wrap: wrap; cursor: default; }
.contact-actions { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
.panel { background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-top: 16px; }
.panel h2 { font-size: 1.2rem; margin-bottom: 6px; }
.panel .btn-block + .btn-block { margin-top: 8px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
/* ---------- Encabezado de sección con descarga ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.page-head .page-title { margin: 0; }
.page-head .btn .ico, .section-tools .btn .ico { width: 20px; height: 20px; }
.section-tools { display: flex; justify-content: flex-end; margin: -2px 0 8px; }

/* ---------- Inventario ---------- */
.inv-actions { margin-bottom: 4px; }
.inv-group { margin-top: 18px; }
.inv-group .group-label { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.inv-group .group-label span { background: #e7e3da; color: var(--ink); border-radius: 999px; padding: 0 9px; font-size: .8rem; letter-spacing: 0; }
.inv-group .list { margin: 0; gap: 8px; }
.item-card { padding: 10px 10px 10px 16px; gap: 10px; cursor: default; }
.item-card.is-empty .qty-value b { color: var(--red); }
.item-main { flex: 1; min-width: 0; display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 6px 0; cursor: pointer; font: inherit; color: inherit; }
.item-main:hover .card-title { text-decoration: underline; }
.qty { display: flex; align-items: center; gap: 4px; flex: none; }
.qty-btn { width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--navy); }
.qty-btn:hover:not([disabled]) { border-color: #aaa395; }
.qty-btn[disabled] { opacity: .35; cursor: not-allowed; }
.qty-btn .ico { width: 22px; height: 22px; stroke-width: 2.2; }
.qty-value { min-width: 64px; display: grid; justify-items: center; line-height: 1.1; font-variant-numeric: tabular-nums; }
.qty-value b { font-size: 1.3rem; }
.qty-value small { color: var(--muted); font-size: .78rem; }
.form-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.steps { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
@media (max-width: 520px) {
  .item-card { padding: 8px 8px 8px 14px; }
  .item-card .card-title { font-size: 1rem; }
  .qty-btn { width: 44px; height: 44px; }
  .qty-value { min-width: 50px; }
  .qty-value b { font-size: 1.15rem; }
  .form-two { grid-template-columns: 1fr; gap: 0; }
}
@media (max-width: 720px) { .tabs a { font-size: .6rem; padding: 6px 0; } }

/* ---------- Filtros del inventario ---------- */
.inv-filters { display: grid; gap: 10px; margin: 14px 0 4px; }
.inv-filters .search { margin: 0; }
.filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.filter-row:empty { display: none; }
.filter { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
.filter select { min-height: 54px; font-weight: 500; }
.chip b { margin-left: 4px; font-weight: 700; opacity: .75; }
.filter-summary { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-weight: 600; }

/* ---------- Movimientos de stock ---------- */
button.qty-value { background: none; border: 0; border-radius: 10px; padding: 4px 2px; cursor: pointer; font: inherit; color: inherit; }
button.qty-value:hover { background: var(--bg); }
button.qty-value b { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.initial-line { margin: -6px 0 12px !important; font-size: .92rem; }
.initial-line small { font-size: .82rem; }
.card-initial { color: var(--muted); font-size: .8rem; }
.stock-modes { margin: 4px 0 6px; }
.stock-modes .ico { width: 18px; height: 18px; }
.stock-modes button[disabled] { opacity: .4; cursor: not-allowed; }
.stepper { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.stepper input { text-align: center; font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
#moveChips { margin-top: 10px; }
.move-preview { font-weight: 700; margin: 14px 0 0 !important; }
.move-preview.is-error { color: var(--red); }
.moves { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .9rem; }
.moves li { display: grid; grid-template-columns: 9em 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.moves span:last-child { color: var(--muted); }
.move-in { color: var(--green-dark); font-weight: 700; }
.move-out { color: var(--red); font-weight: 700; }
.move-count { font-weight: 700; }
@media (max-width: 520px) { .moves li { grid-template-columns: 1fr auto; } .moves li span:nth-child(2) { grid-column: 1 / -1; order: 3; color: var(--muted); } }

/* ---------- Planilla compartida ---------- */
.sync { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: .78rem; font-weight: 600; color: #dfe5f2; white-space: nowrap; }
.sync-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; flex: none; }
.sync-busy .sync-dot { background: #fbbf24; }
.sync-error .sync-dot { background: #f87171; }
.sheet-state { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }
.sheet-state .ico { color: var(--green); margin-top: 2px; }
.sheet-form { display: grid; gap: 4px; }
.sheet-form .btn { margin-top: 14px; }
.panel .btn + .btn, .panel .btn + .btn-link-danger { margin-top: 8px; }
.saving { margin: 0; font-weight: 700; color: var(--muted); text-align: center; }

/* ---------- Ventanas ---------- */
dialog {
  border: 0; border-radius: 22px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .3); color: var(--ink);
}
dialog::backdrop { background: rgba(15, 20, 35, .55); }
.dlg { padding: 24px; position: relative; }
.dlg h2 { font-size: 1.4rem; margin: 0 44px 8px 0; }
.dlg p { margin: 8px 0; }
.dlg-x { position: absolute; top: 14px; right: 14px; width: 48px; height: 48px; border-radius: 12px; border: 0; background: var(--bg); cursor: pointer; display: grid; place-items: center; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.dlg-actions .btn { flex: 1 1 auto; }
.big-status { font-size: 1.1rem; margin: 14px 0 !important; }
@media (max-width: 560px) {
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 22px 22px 0 0; max-height: 92vh; }
  .dlg { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .dlg-actions { flex-direction: column; align-items: stretch; }
}

/* ---------- Aviso inferior ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 28px; z-index: 100;
  background: var(--ink); color: #fff; border-radius: 16px; padding: 12px 12px 12px 20px;
  display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100vw - 24px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .3); font-weight: 600;
}
.toast[hidden] { display: none; }
.toast-undo { min-height: 48px; padding: 8px 16px; border-radius: 12px; border: 2px solid #fff; background: transparent; color: #fff; font-weight: 800; cursor: pointer; }
.toast:not(:has(button)) { padding: 16px 20px; }
@media (max-width: 720px) { .toast { bottom: calc(96px + env(safe-area-inset-bottom)); } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Orden impresa (blanco y negro, Arial, A4, dos copias con línea de corte) ---------- */
/* Cada copia ocupa media hoja. Los márgenes van dentro de cada mitad para que nada quede
   pegado al borde ni a la línea de corte, aunque la impresora tenga bordes sin impresión. */
.print-sheet { display: none; }
@media print {
  @page { size: A4 portrait; margin: 10mm 12mm; }
  html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; font-size: 10pt !important; }
  body > *:not(.print-sheet) { display: none !important; }
  .print-sheet {
    display: flex; flex-direction: column; box-sizing: border-box; width: 100%; max-width: 186mm; height: 276mm; margin: 0 auto;
    font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 10pt; line-height: 1.35;
  }
  .ps-copy { box-sizing: border-box; height: 130mm; padding: 5mm 5mm 0; overflow: hidden; flex: none; }
  .ps-cut { flex: 1; display: flex; align-items: center; border: 0; position: relative; }
  .ps-cut::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1pt dashed #000; }
  .ps-cut span { position: relative; margin: 0 auto; background: #fff; padding: 0 3mm; font-size: 8pt; letter-spacing: .08em; text-transform: uppercase; }
  .ps-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm; border-bottom: 1.25pt solid #000; padding-bottom: 3mm; }
  .ps-head h1 { font-size: 13pt; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  .ps-head p { margin: 1mm 0 0; font-size: 8.5pt; }
  .ps-num { display: grid; text-align: right; gap: .5mm; flex: none; font-size: 9pt; }
  .ps-num strong { font-size: 12pt; }
  .ps-sign { display: flex; justify-content: flex-end; margin-top: 4mm; }
  /* Espacio para firmar arriba, con la línea y la leyenda debajo. */
  .ps-sign span { position: relative; width: 75mm; padding-top: 13mm; font-size: 8pt; text-align: center; }
  .ps-sign span::before { content: ""; position: absolute; left: 0; right: 0; top: 12mm; border-top: .75pt solid #000; }
  .ps-task { font-size: 13pt; font-weight: bold; margin: 5mm 0 3mm; display: flex; align-items: center; gap: 3mm; flex-wrap: wrap; }
  .ps-urgent { font-size: 8.5pt; text-transform: uppercase; letter-spacing: .08em; border: 1pt solid #000; padding: .6mm 2.5mm; }
  .ps-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .ps-table th, .ps-table td { border-bottom: .75pt solid #000; padding: 2.2mm 1.5mm; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .ps-table tr:first-child th, .ps-table tr:first-child td { border-top: .75pt solid #000; }
  .ps-table th { width: 32mm; font-weight: bold; }
  .ps-table td { white-space: pre-line; }
}

  <script>
// Lógica de la aplicación (sin pantalla): catálogos, datos, búsquedas y mensajes.
// Se usa en el navegador (window.Core) y en las pruebas de Node (require).
(function (root) {
  'use strict';

  const STORAGE_KEY = 'intendencia-estado-v2';
  const BACKUP_KEY = 'intendencia-ultima-copia';

  // Los nombres largos se conservan tal cual para no romper los datos guardados.
  const BUILDINGS = [
    {id: 'Diagonal Roque Sáenz Peña 1211', short: 'Diagonal', address: 'Diagonal Norte 1211'},
    {id: 'Av. Callao 635', short: 'Callao', address: 'Av. Callao 635'},
    {id: 'Montevideo 546', short: 'Montevideo', address: 'Montevideo 546'}
  ];

  // En lugar de nombres de empleados se trabaja con oficios.
  // "key" es el valor que ya usaban las órdenes guardadas (especialidad).
  const TRADES = [
    {key: 'Electricidad', label: 'Electricista', icon: 'bolt', hint: 'Luces, enchufes, timbres'},
    {key: 'Plomería', label: 'Plomero', icon: 'drop', hint: 'Canillas, baños, pérdidas'},
    {key: 'Carpintería', label: 'Carpintero', icon: 'door', hint: 'Puertas, cerraduras, muebles'},
    {key: 'Aires Acondicionados', label: 'Técnico de aire', icon: 'snow', hint: 'Aire acondicionado'},
    {key: 'Pintura', label: 'Pintor', icon: 'roller', hint: 'Paredes, puertas, retoques'},
    {key: 'Albañilería', label: 'Albañil', icon: 'bricks', hint: 'Revoque, baldosas, filtraciones'},
    {key: 'Herrería', label: 'Herrero', icon: 'hammer', hint: 'Rejas, soldaduras, metal'},
    {key: 'Tapicería', label: 'Tapicero', icon: 'chair', hint: 'Sillas y asientos'},
    {key: 'Ayudante', label: 'Ayudante', icon: 'box', hint: 'Traslados, limpieza, carteles'},
    {key: 'Portería', label: 'Portería', icon: 'key', hint: 'Llaves, accesos, proveedores'},
    {key: 'Administrativo', label: 'Administrativo', icon: 'clipboard', hint: 'Papeles, pedidos, proveedores'}
  ];

  const TASKS = {
    'Electricidad': ['Cambio de tubo de luz', 'Cambio de lámpara LED', 'Reparación o cambio de enchufe', 'Cambio de interruptor', 'Revisión de artefacto de iluminación', 'Revisión de luz de emergencia', 'Reparación de timbre', 'Registrar falla de ascensor', 'Control de señalización de evacuación'],
    'Plomería': ['Pérdida en canilla', 'Destapar desagote', 'Cambio de flexible', 'Reparación de descarga de inodoro', 'Cambio de grifería', 'Reparación de sifón', 'Revisión de pérdida de agua'],
    'Carpintería': ['Cambio de cerradura', 'Ajuste de puerta', 'Ajuste de bisagras', 'Cambio de picaporte', 'Reparación de cajón', 'Reparación de escritorio', 'Colocación de estante'],
    'Aires Acondicionados': ['Revisión de aire acondicionado', 'Limpieza de filtros de aire', 'Revisión de desagote de aire'],
    'Pintura': ['Retoque de pintura', 'Pintura de pared', 'Pintura de puerta'],
    'Albañilería': ['Reparación de revoque', 'Reposición de baldosa', 'Sellado de filtración'],
    'Tapicería': ['Reparación de silla', 'Retapizado de asiento'],
    'Herrería': ['Reparación de reja', 'Reparación de puerta metálica', 'Soldadura', 'Reparación de baranda', 'Colocación de herraje', 'Reparación de estructura metálica'],
    'Portería': ['Abrir o cerrar una oficina', 'Entrega de llaves', 'Recibir a un proveedor', 'Acompañar a un servicio técnico', 'Traslado de correspondencia', 'Control de acceso'],
    'Ayudante': ['Movimiento de mobiliario', 'Retiro de materiales', 'Limpieza extraordinaria', 'Colocación de cartelería'],
    'Administrativo': ['Preparación de pedido de insumos', 'Seguimiento de proveedor', 'Control de inventario', 'Carga de documentación']
  };

  // Estados guardados → cómo se muestran. Se mantienen los valores que ya existían.
  const STATUSES = [
    {value: 'Pendiente', label: 'Pendiente', icon: 'clock'},
    {value: 'En proceso', label: 'En curso', icon: 'wrench'},
    {value: 'Faltan insumos', label: 'Faltan materiales', icon: 'alert'},
    {value: 'Resuelto', label: 'Terminado', icon: 'check'}
  ];
  const DONE = 'Resuelto';

  const trade = key => TRADES.find(t => t.key === key);
  const tradeLabel = key => trade(key)?.label || 'Sin oficio';
  const building = id => BUILDINGS.find(b => b.id === id);
  const buildingShort = id => building(id)?.short || String(id || '');
  const statusInfo = value => STATUSES.find(s => s.value === value) || STATUSES[0];
  const isDone = o => o.status === DONE;
  const isUrgent = o => o.priority === 'Urgente';

  function normalizeText(value) {
    return String(value || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9@]+/g, ' ').trim();
  }

  // ---------- Dependencias por edificio (desde la guía PJN de contacts-data.js) ----------
  function buildingForAddress(address) {
    const s = String(address || '');
    if (/(?:Roque|Diagonal).*1211/i.test(s)) return BUILDINGS[0].id;
    if (/Callao\s+635/i.test(s)) return BUILDINGS[1].id;
    if (/Montevideo\s+546/i.test(s)) return BUILDINGS[2].id;
    return '';
  }

  function floorFromAddress(address) {
    const parts = String(address || '').split(',').slice(1).map(p => p.trim()).filter(Boolean);
    return parts.join(', ');
  }

  function shortDependency(value) {
    const text = String(value || '');
    const match = text.match(/juzgado.*?(?:N\.?\s*[.º°]*\s*|número\s*)(\d+)/i) || text.match(/juzgado\s+(\d+)/i);
    return match ? `Juzgado N.º ${match[1]}` : text;
  }

  function dependencyName(contact) {
    if (/^PJN-COM-J\d+$/.test(contact.id)) return `Juzgado N.º ${contact.id.match(/\d+$/)[0]}`;
    if (contact.id.startsWith('PJN-COM-SALA-')) return `Sala ${contact.id.slice(-1)}`;
    if (contact.id === 'PJN-COM-MESA-DIAGONAL') return null; // duplica Mesa General de Entradas
    if (contact.id === 'PJN-COM-AUXILIARES') return 'Auxiliares de Justicia';
    if (contact.id === 'PJN-COM-CAMARA') return 'Cámara (Presidencia)';
    return contact.name;
  }

  // Devuelve [{name, floor}] ordenado: juzgados por número, luego salas, luego el resto.
  function dependenciesForBuilding(buildingId, catalog) {
    if (!building(buildingId)) return [];
    const seen = new Set();
    const list = [];
    (catalog || []).forEach(c => {
      if (buildingForAddress(c.building) !== buildingId) return;
      const name = dependencyName(c);
      if (!name || seen.has(name)) return;
      seen.add(name);
      list.push({name, floor: floorFromAddress(c.building)});
    });
    const rank = d => /^Juzgado/.test(d.name) ? 0 : /^Sala/.test(d.name) ? 1 : 2;
    list.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'es', {numeric: true}));
    list.push({name: 'Portería', floor: 'Planta baja'}, {name: 'Otro lugar', floor: ''});
    return list;
  }

  // ---------- Datos guardados ----------
  function emptyState(catalog) {
    return {orders: [], tools: [], items: [], contacts: structuredClone(catalog || []), people: []};
  }

  // Ordena y completa los datos, también los que vienen de versiones anteriores.
  // No borra información de secciones ocultas (obras, guías, insumos…): solo la deja guardada.
  function normalizeState(input, catalog) {
    const s = input && typeof input === 'object' ? input : emptyState(catalog);
    ['orders', 'tools', 'contacts', 'people', 'items'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });

    const roleMap = {'Mantenimiento general': 'Ayudante', 'Servicios y traslados': 'Ayudante', 'Patrimonio': 'Carpintería', 'Sanitarios': 'Plomería', 'Aire acondicionado': 'Aires Acondicionados'};
    const roleOf = id => {
      const p = s.people.find(x => x.id === id);
      return p ? (roleMap[p.role] || p.role) : '';
    };

    const categoryTrade = {'Carpintería': 'Carpintería', 'Aire acondicionado': 'Aires Acondicionados', 'Electricidad': 'Electricidad', 'Sanitarios': 'Plomería', 'Pintura': 'Pintura', 'Albañilería': 'Albañilería', 'Tapicería': 'Tapicería', 'Administrativo': 'Administrativo', 'Ascensores': 'Electricidad', 'Seguridad': 'Electricidad'};
    s.orders.forEach(o => {
      if (!trade(o.specialty)) o.specialty = roleOf(o.assignee) || categoryTrade[o.category] || 'Ayudante';
      if (!STATUSES.some(x => x.value === o.status)) o.status = 'Pendiente';
      if (!o.priority) o.priority = 'Media';
    });

    // Herramientas: "entregada a" se guarda como el nombre de la persona.
    // En la versión anterior era el código de un empleado (p1, p2…): se reemplaza por su nombre.
    s.tools.forEach(t => {
      const p = t.holder && s.people.find(x => x.id === t.holder);
      if (p) t.holder = String(p.name || '').trim();
      t.holder = String(t.holder || '').trim();
      if (t.holder) t.toolStatus = 'Entregada';
      else if (!t.toolStatus || t.toolStatus === 'Entregada') t.toolStatus = 'Disponible';
    });

    if (!s.contacts.length && catalog) s.contacts = structuredClone(catalog);
    return s;
  }

  function nextId(list, prefix) {
    const n = Math.max(0, ...list.map(x => Number(String(x.id || '').split('-')[1]) || 0)) + 1;

  // ---------- Pedidos ----------
  function orderPlace(o) {

  }

  // Nombres para sugerir al asignar una herramienta: los del personal anterior y los ya usados.
  function peopleNames(state) {
    const names = [...(state.people || []).map(p => p.name), ...(state.tools || []).flatMap(t => [t.holder, ...(t.returns || []).map(r => r.holderName)])];

  }

  function searchOrders(orders, q) {
    const query = normalizeText(q);
    if (!query) return orders.slice();
    const words = query.split(' ');
    return orders.filter(o => {
      const text = normalizeText([o.id, o.title, o.description, o.dependency, shortDependency(o.dependency), buildingShort(o.building), o.location, tradeLabel(o.specialty), o.specialty].join(' '));
      return words.every(w => text.includes(w));

  // Abiertos: urgentes primero y después los más viejos (los que esperan hace más tiempo).
  // Terminados: los más recientes primero.
  function sortOrders(list, done) {
    return list.slice().sort((a, b) => {
      if (done) return String(b.completedAt || b.updatedAt || '').localeCompare(String(a.completedAt || a.updatedAt || ''));

  // ---------- Contactos ----------
  function courtNumber(c) { return /juzgado.*?(\d+)/i.exec(c.name || '')?.[1] || ''; }
  function searchContacts(contacts, q) {
    const query = normalizeText(q);
    const numeric = /^(?:juzgados?\s+)?(\d+)$/.exec(query);
    const matches = c => {
      if (numeric) return courtNumber(c).includes(numeric[1]);
      const text = normalizeText([c.name, c.organization, c.role, c.building, c.phone, c.email].join(' '));
      return query.split(' ').filter(Boolean).every(w => text.includes(w));
    };
    const score = c => numeric ? (courtNumber(c).startsWith(numeric[1]) ? 0 : 1) : (normalizeText(c.name).startsWith(query) ? 0 : 1);

  // ---------- Fechas ----------

    const date = /^\d{4}-\d{2}-\d{2}$/.test(value) ? new Date(value + 'T12:00:00-03:00') : new Date(value);
    if (Number.isNaN(date.getTime())) return 'Fecha no registrada';
    const hasTime = !/^\d{4}-\d{2}-\d{2}$/.test(value);
    const time = hasTime ? ' a las ' + new Intl.DateTimeFormat('es-AR', {timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).format(date) : '';
    const diff = Math.round((new Date(dayKey(now)) - new Date(dayKey(date))) / 86400000);
    if (diff === 0) return 'Hoy' + time;
    if (diff === 1) return 'Ayer' + time;
    if (diff > 1 && diff < 7) return `Hace ${diff} días`;

  function fullDate(value) {
    if (!value) return 'No registrada';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'No registrada';
    return new Intl.DateTimeFormat('es-AR', {timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).format(date) + ' h';

  function daysSince(value, now = new Date()) {

  // Argentina no tiene horario de verano: UTC-3 todo el año.

  const ORDER_COLUMNS = [
    {header: 'Número', width: 9}, {header: 'Fecha del pedido', width: 17}, {header: 'Trabajo', width: 26}, {header: 'Oficio', width: 13},
    {header: 'Edificio', width: 11}, {header: 'Dependencia', width: 15}, {header: 'Piso / oficina', width: 16}, {header: 'Urgente', width: 8},
    {header: 'Estado', width: 13}, {header: 'Terminado el', width: 17}, {header: 'Indicaciones', width: 30}];
  const TOOL_COLUMNS = [
    {header: 'Código', width: 9}, {header: 'Herramienta', width: 24}, {header: 'Marca y modelo', width: 22}, {header: 'N.º de inventario', width: 16},

  const CONTACT_COLUMNS = [
    {header: 'Código', width: 16}, {header: 'Nombre', width: 28}, {header: 'Teléfono', width: 18}, {header: 'Correo', width: 28}, {header: 'Para qué sirve', width: 32}];

  const orderRow = o => [
    o.id, fullDate(o.createdAt), o.title, tradeLabel(o.specialty), buildingShort(o.building),
    shortDependency(o.dependency), o.location || '', isUrgent(o) ? 'Sí' : '', statusInfo(o.status).label,

  const toolRow = t => [
    t.id, t.name, [t.brand, t.model].filter(Boolean).join(' '), t.serial || '',
    t.holder ? 'Asignada' : (t.toolStatus || 'Disponible'), t.holder || '',
    t.holder && t.assignedDate ? String(t.assignedDate).split('-').reverse().join('/') : '', t.notes || ''

  const contactRow = c => [c.id, c.name || '', c.phone || '', c.email || '', c.notes || ''];

  // ---------- Inventario ----------
  const ITEM_COLUMNS = [
    {header: 'Código', width: 9}, {header: 'Categoría', width: 22}, {header: 'Elemento', width: 26}, {header: 'Detalle / variante', width: 22},
    {header: 'Cantidad', width: 10}, {header: 'Unidad', width: 10}, {header: 'Estado', width: 16}, {header: 'Ubicación', width: 16},
    {header: 'Observaciones', width: 28}, {header: 'Actualizado', width: 17}];
  const qtyText = q => (q === null || q === undefined || q === '') ? 'Sin contar' : String(q);
  const itemRow = i => [i.id, i.category || '', i.name || '', i.detail || '', qtyText(i.quantity), i.unit || '', i.status || '', i.location || '', i.notes || '', fullDate(i.updatedAt)];

  // Cantidad: número entero o decimal; vacío o «S/D» = sin contar.

  // Un mismo elemento puede figurar dos veces con distinto estado (por ejemplo, rollos nuevos y rollos en uso).
  const itemKey = i => normalizeText([i.category, i.name, i.detail, i.status].join('|'));

  // Convierte las filas de un Excel/CSV en ítems. Busca la fila de títulos (la que dice «Elemento»)
  // y reconoce las columnas por nombre, sin importar mayúsculas ni tildes.
  const HEADER_ALIASES = {
    category: ['categoria', 'rubro'], name: ['elemento', 'item', 'articulo', 'producto', 'nombre'],
    detail: ['detalle variante', 'detalle', 'variante', 'descripcion'], quantity: ['cantidad', 'stock'],
    unit: ['unidad', 'presentacion'], status: ['estado'], location: ['ubicacion', 'lugar', 'deposito'], notes: ['observaciones', 'notas', 'nota']
  };
  function rowsToItems(rows) {
    const clean = rows.map(r => (r || []).map(c => String(c ?? '').trim()));
    const h = clean.findIndex(r => r.some(c => HEADER_ALIASES.name.includes(normalizeText(c))));
    if (h < 0) return {items: [], error: 'No encontré la columna «Elemento». La primera fila con títulos tiene que tener una columna llamada Elemento.'};
    const head = clean[h].map(normalizeText);
    const col = {};
    Object.entries(HEADER_ALIASES).forEach(([field, names]) => {
      for (const n of names) { const i = head.indexOf(n); if (i >= 0) { col[field] = i; break; } }
    });
    const items = [];
    clean.slice(h + 1).forEach(r => {
      const get = f => col[f] === undefined ? '' : (r[col[f]] || '');
      const name = get('name');
      if (!name) return;
      items.push({
        category: get('category') || 'Sin categoría', name, detail: get('detail'), quantity: parseQuantity(get('quantity')),
        unit: get('unit'), status: get('status'), location: get('location'), notes: get('notes')

  }

  // Une lo importado con lo existente: mismo elemento (categoría + nombre + detalle + estado) se actualiza, el resto se agrega.
  function mergeItems(existing, incoming) {

        if (n.quantity === null && old.quantity !== undefined) merged.quantity = old.quantity;

  // ---------- Unidades en singular y plural ----------
  // «1 rollo», «7 rollos», «1 unidad», «3 unidades». Solo cambia la primera palabra («caja x 50» → «cajas x 50»).
  function pluralWord(w) {
    if (!w || /s$/i.test(w)) return w;

  const qtyWithUnit = (n, unit) => [String(n), unitText(unit, n)].filter(Boolean).join(' ');
  // Unidades femeninas (caja, lata, bolsa, unidad…) para decir «¿Cuántas?» en lugar de «¿Cuántos?».

    {value: 'empty', label: 'Sin stock', test: i => !isUncounted(i) && Number(i.quantity) === 0},

    const words = normalizeText(f.q).split(' ').filter(Boolean);
    const stock = STOCK_FILTERS.find(x => x.value === (f.stock || '')) || STOCK_FILTERS[0];
    return items.filter(i =>
      (!f.category || i.category === f.category) &&
      (!f.status || (i.status || '') === f.status) &&
      (!f.location || (i.location || '') === f.location) &&

  function movementRows(items) {

  const shortDate = v => {

  };
  const byDate = (a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
  const EXPORTS = {
    orders: {name: 'Pedidos', label: 'Pedidos de trabajo', columns: ORDER_COLUMNS, sort: byDate, row: orderRow},
    items: {name: 'Inventario', label: 'Inventario', sort: itemSort, columns: [
      {header: 'N°', width: 6}, {header: 'Categoría', width: 24}, {header: 'Elemento', width: 28}, {header: 'Detalle / variante', width: 24},
      {header: 'Stock inicial', width: 10}, {header: 'Cantidad actual', width: 10}, {header: 'Unidad', width: 10}, {header: 'Estado', width: 18},
      {header: 'Ubicación', width: 16}, {header: 'Observaciones', width: 30}, {header: 'Fecha de carga', width: 12}],
      row: (i, n) => {
        const ini = initialStock(i);
        return [n, i.category || '', i.name || '', i.detail || '', ini.quantity === null ? 'S/D' : Number(ini.quantity), isUncounted(i) ? 'S/D' : Number(i.quantity),
          i.unit || '', i.status || '', i.location || '', i.notes || '', shortDate(ini.at || i.createdAt || i.updatedAt)];

    tools: {name: 'Herramientas', label: 'Herramientas', sort: (a, b) => String(a.name).localeCompare(String(b.name), 'es'), columns: [

      {header: 'Estado', width: 16}, {header: 'Asignada a', width: 22}, {header: 'Desde', width: 12}, {header: 'Observaciones', width: 30}],
      row: (t, n) => [n, t.name || '', t.brand || '', t.model || '', t.serial || '', t.holder ? 'Asignada' : (t.toolStatus || 'Disponible'), t.holder || '', t.holder ? shortDate(t.assignedDate) : '', t.notes || '']},

      {header: 'N°', width: 6}, {header: 'Nombre', width: 34}, {header: 'Dirección', width: 34}, {header: 'Teléfono', width: 20}, {header: 'Correo', width: 32}, {header: 'Notas', width: 30}],

  }

    const stamp = fullDate(now.toISOString());
    const copy = label => `Intendencia · ${label} · copia del ${stamp}`;
    return [
      sectionSheet('orders', state.orders, {title: copy('Pedidos de trabajo')}),
      sectionSheet('tools', state.tools, {title: copy('Herramientas')}),

  }

  const Core = {
    STORAGE_KEY, BACKUP_KEY, BUILDINGS, TRADES, TASKS, STATUSES, DONE,
    trade, tradeLabel, building, buildingShort, statusInfo, isDone, isUrgent,
    normalizeText, buildingForAddress, shortDependency, dependenciesForBuilding,
    emptyState, normalizeState, nextId, orderPlace, peopleNames,
    searchOrders, sortOrders, searchContacts, when, fullDate, daysSince,
    EXCEL_KEY, lastFridayNoon, weeklyExcelDue, excelSheets,
    ORDER_COLUMNS, TOOL_COLUMNS, CONTACT_COLUMNS, orderRow, toolRow, contactRow, isCustomContact,
    ITEM_COLUMNS, itemRow, qtyText, parseQuantity, itemKey, rowsToItems, mergeItems, parseCsv, itemSort,

  <script>
// Genera un archivo Excel (.xlsx) sin librerías externas.
// Un .xlsx es un .zip con algunos archivos XML adentro; acá se arma ese zip "a mano" (sin comprimir).
(function (root) {
  'use strict';

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;

  async function unzip(buffer) {
    const bytes = new Uint8Array(buffer);

    let end = bytes.length - 22;

      const size = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const local = view.getUint32(p + 42, true);
      const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
